<!doctype html>
<html lang="ko" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISABELLINE | The Night</title>
  <meta name="description" content="Halloween limited candles by ISABELLINE. Take the flame and light the night.">
  <link rel="icon" href="../assets/favicon/favicon-black.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500&family=Hahmlet:wght@200;300;400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link rel="preload" as="image" href="../assets/images/night/hero-off.webp">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/night.css">
</head>
<body class="night is-intro">
  <div class="arrive" id="arrive" aria-hidden="true"><span>ISABELLINE</span></div>

  <!-- The room stays still behind everything -->
  <div class="backdrop" id="backdrop" aria-hidden="true">
    <div class="art" id="heroArt">
      <img class="art__off" src="../assets/images/night/hero-off.webp" alt="">
      <img class="art__on" id="heroOn" src="../assets/images/night/hero-on.webp" alt="">
      <img class="art__full" src="../assets/images/night/hero-on.webp" alt="">
      <div class="art__flicker" id="heroFlicker"></div>
      <span class="spot" data-i="0" style="left:15.03%;top:35.37%"></span>
      <span class="spot" data-i="1" style="left:36.98%;top:52.52%"></span>
      <span class="spot" data-i="2" style="left:66.75%;top:60.02%"></span>
      <span class="spot" data-i="3" style="left:90.50%;top:18.22%"></span>
      <span class="spot" data-i="4" style="left:88.99%;top:55.73%"></span>
    </div>
  </div>

  <canvas id="dark" aria-hidden="true"></canvas>

  <main class="rooms" id="rooms">
    <section class="room room--hero" id="top" aria-labelledby="nightTitle">
      <h1 class="night-title" id="nightTitle" data-i18n="night.title"></h1>
      <p class="room__guide" id="heroGuide" data-i18n="night.guideHero"></p>
      <a class="room__return back" href="../index.html"><span class="arrow">←</span> <span data-i18n="night.return"></span></a>
    </section>

    <section class="room room--explore" id="explore" aria-labelledby="exploreTitle">
      <div class="inner">
        <div class="explore__layout">
          <div class="explore__grid" id="exploreGrid"></div>
          <aside class="panel" id="panel" aria-live="polite">
            <h2 class="serif panel__title" id="exploreTitle" data-i18n="night.limited"></h2>
            <p class="panel__count"><b id="exploreCount">0</b> / 6 <span data-i18n="night.lit"></span></p>
            <div class="panel__body" id="panelBody">
              <p class="panel__hint" data-i18n="night.guideExplore"></p>
            </div>
          </aside>
        </div>
      </div>
    </section>

    <section class="room room--scent" id="scent" aria-labelledby="scentTitle">
      <div class="inner">
        <div class="section-head">
          <h2 class="serif" id="scentTitle" data-i18n="night.scent"></h2>
          <p data-i18n="night.scentSub"></p>
        </div>
        <div class="scent__list dimlist" id="scentList"></div>

        <nav class="wayback" aria-label="Way back">
          <a class="wayback__link back" href="../index.html"><span class="arrow">←</span> <span data-i18n="night.toDay"></span></a>
          <a class="wayback__link" href="#top" data-top><span data-i18n="night.toTop"></span> <span class="arrow arrow--up">↑</span></a>
        </nav>
      </div>
      <div data-footer></div>
    </section>
  </main>

  <div class="scrollcue" id="scrollcue" aria-hidden="true">
    <span class="scrollcue__arrow" id="cueArrow">↓</span>
    <span data-i18n="night.scroll" id="cueText"></span>
  </div>

  <div class="stand" id="stand">
    <button type="button" class="stand__btn" id="standBtn" data-i18n-aria="night.take">
      <span class="stand__glow"></span>
      <span class="flame__body"></span>
    </button>
  </div>

  <div class="flame" id="flame" aria-hidden="true"><div class="flame__body"></div></div>

  <div class="fade" id="fade" aria-hidden="true">
    <div class="smoke-wrap" id="smoke">
      <span class="smoke"></span><span class="smoke"></span><span class="smoke"></span>
    </div>
  </div>

  <!-- Intro: a framed film on a page that glows with it -->
  <section class="intro" id="intro" aria-label="Intro">
    <canvas class="intro__ambient" id="ambient" width="64" height="36" aria-hidden="true"></canvas>
    <p class="intro__brand">ISABELLINE<span>The Night</span></p>
    <div class="intro__frame" id="introFrame">
      <video id="introVideo" src="../assets/video/halloween-intro.mp4" poster="../assets/images/night/intro-poster.webp" muted playsinline preload="auto"></video>
      <video id="loopVideo" src="../assets/video/candle-idle-loop.mp4" poster="../assets/images/night/candle-poster.webp" muted playsinline loop preload="auto"></video>
      <div class="intro__vignette" aria-hidden="true"></div>
      <button class="intro__knock" id="introKnock" type="button" data-i18n="night.knock"></button>
      <p class="intro__take" data-i18n="night.take"></p>
    </div>
    <p class="intro__line" id="introLine" aria-live="polite"></p>
    <ol class="intro__steps" id="introSteps">
      <li class="is-on" data-i18n="intro.s1"></li>
      <li data-i18n="intro.s2"></li>
      <li data-i18n="intro.s3"></li>
    </ol>
  </section>

  <script src="../js/common.js"></script>
  <script src="../js/night.js"></script>
</body>
</html>
